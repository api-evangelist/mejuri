name: Mejuri
description: >-
  Mejuri is a direct-to-consumer fine jewelry brand founded in Toronto that
  designs and sells everyday fine jewelry — rings, earrings, necklaces and
  bracelets — direct to consumers through its e-commerce site, mobile app, and
  a growing network of retail stores across North America, Australia, and the
  United Kingdom. The company also runs the Mejuri+ membership program, offers
  in-store ear piercing services, and hosts community events. Surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network, this
  profile has been through the enrichment pipeline: Mejuri operates a
  consumer-facing commerce experience and publishes no public developer API,
  developer portal, or OpenAPI surface.
